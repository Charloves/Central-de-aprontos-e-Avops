<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 18px;
      background: #f5f5f5;
      color: #212529;
    }

    .card {
      max-width: 560px;
      margin: 0 auto;
      padding: 18px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: white;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .muted {
      color: #666;
      font-size: 13px;
      line-height: 1.35;
    }

    .row {
      margin-top: 4px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 13px;
      font-weight: 600;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      text-transform: uppercase;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      background: #2c6ed5;
      color: white;
      font-weight: 600;
    }

    button:disabled {
      background: #9bb7e8;
    }

    .msg {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    iframe {
      width: 100%;
      height: 92vh;
      border: none;
    }

    @media (max-width: 600px) {
      body {
        margin: 12px;
      }

      .card {
        padding: 14px;
      }

      .title {
        font-size: 18px;
      }

      input,
      button {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Ciência de AVOP</div>

    <div class="row">
      <b><?= avopId ?></b> — <?= titulo ?>
    </div>

    <p class="muted">
      Informe seu <b>TRIGRAMA</b> para registrar a ciência do AVOP.
    </p>

    <label for="id">TRIGRAMA</label>
    <input
      id="id"
      placeholder="Ex: CHA"
      maxlength="3"
      autocomplete="off"
      oninput="this.value = this.value.toUpperCase()"
    />

    <label for="nome">Nome (opcional)</label>
    <input
      id="nome"
      placeholder="Ex: Fulano"
      autocomplete="off"
    />

    <button id="btn" onclick="enviar()">
      Registrar ciência e abrir AVOP
    </button>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    const avopId = "<?= avopId ?>";
    const pdfUrl = "<?= pdfUrl ?>";
    const baseUrl = "<?= baseUrl ?>";

    function setMsg(text, ok = true) {
      const el = document.getElementById('msg');
      if (!el) return;
      el.textContent = text;
      el.style.color = ok ? 'green' : 'crimson';
    }

    function enviar() {
      const id = document.getElementById('id').value.trim();
      const nome = document.getElementById('nome').value.trim();
      const btn = document.getElementById('btn');

      if (!id) {
        setMsg('Informe seu trigrama.', false);
        return;
      }

      btn.disabled = true;
      setMsg('Registrando ciência...', true);

      google.script.run
        .withSuccessHandler((res) => {
          if (!res || !res.ok) {
            setMsg((res && res.msg) ? res.msg : 'Erro ao registrar.', false);
            btn.disabled = false;
            return;
          }

          setMsg(res.msg, true);
          abrirPDF();
        })
        .withFailureHandler((err) => {
          setMsg('Falha: ' + (err && err.message ? err.message : err), false);
          btn.disabled = false;
        })
        .registrarLeitura({ avopId, id, nome });
    }

    function abrirPDF() {
      document.body.innerHTML = '';

      const wrapper = document.createElement('div');
      wrapper.style.padding = '12px';
      wrapper.style.background = '#f5f7fa';
      wrapper.style.fontFamily = 'Arial, sans-serif';

      const barra = document.createElement('div');
      barra.style.marginBottom = '12px';

      const btn = document.createElement('button');
      btn.textContent = '← Voltar para a Central';
      btn.style.padding = '10px 14px';
      btn.style.border = '0';
      btn.style.borderRadius = '8px';
      btn.style.background = '#0d6efd';
      btn.style.color = 'white';
      btn.style.cursor = 'pointer';
      btn.style.fontWeight = '600';

      btn.addEventListener('click', function () {
        window.top.location.href = baseUrl;
      });

      const viewer = document.createElement('iframe');
      viewer.src = pdfUrl;
      viewer.style.width = '100%';
      viewer.style.height = '90vh';
      viewer.style.border = 'none';

      barra.appendChild(btn);
      wrapper.appendChild(barra);
      wrapper.appendChild(viewer);
      document.body.appendChild(wrapper);
    }
  </script>
</body>
</html>
