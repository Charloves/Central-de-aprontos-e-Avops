<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #eef3f9;
      --surface: #ffffff;
      --border: #d7e0ea;
      --text: #122033;
      --muted: #5f6d7c;
      --primary: #0b63ce;
      --shadow: 0 18px 50px rgba(11, 41, 82, 0.08);
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 18px 12px 24px;
      background:
        radial-gradient(circle at top, rgba(11, 99, 206, 0.08), transparent 30%),
        var(--bg);
      color: var(--text);
    }

    .card {
      max-width: 560px;
      margin: 0 auto;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .muted {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }

    .row {
      margin-top: 4px;
    }

    .intro {
      margin-top: 10px;
      padding: 14px 16px;
      border-radius: 14px;
      background: #edf4ff;
      border: 1px solid #d4e5ff;
      font-size: 14px;
      line-height: 1.45;
      color: #294264;
    }

    .intro strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #5f6d7c;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      margin-top: 6px;
      border: 1px solid #b9c8d8;
      border-radius: 12px;
      font-size: 16px;
      text-transform: uppercase;
      color: var(--text);
    }

    button {
      width: 100%;
      padding: 12px 14px;
      margin-top: 14px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      background: var(--primary);
      color: white;
      font-weight: 700;
    }

    button:disabled {
      background: #9bb7e8;
    }

    .msg {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
      min-height: 20px;
    }

    iframe {
      width: 100%;
      height: 92vh;
      border: none;
    }

    @media (max-width: 600px) {
      body {
        padding: 12px 10px 20px;
      }

      .card {
        padding: 14px;
      }

      .title {
        font-size: 18px;
      }

      input,
      button {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">Ciência de AVOP</div>

    <div class="row">
      <b><?= avopId ?></b> — <?= titulo ?>
    </div>

    <div class="intro">
      <strong>Fluxo desta tela</strong>
      Confirme a ciência do AVOP e, em seguida, o documento será aberto para leitura. O trigrama autenticado já vem preenchido automaticamente.
    </div>

    <p class="muted">
      Use esta tela para registrar a ciência do AVOP antes de abrir o documento.
    </p>

    <label for="id">Trigrama</label>
    <input
      id="id"
      placeholder="Ex.: CHA"
      maxlength="3"
      autocomplete="off"
      oninput="this.value = this.value.toUpperCase()"
    />

    <label for="nome">Nome (opcional)</label>
    <input
      id="nome"
      placeholder="Ex.: Fulano"
      autocomplete="off"
    />

    <button id="btn" onclick="enviar()">
      Registrar ciência e abrir o AVOP
    </button>

    <div class="msg" id="msg"></div>
  </div>

  <script>
    const avopId = "<?= avopId ?>";
    const pdfUrl = "<?= pdfUrl ?>";
    const injectedBaseUrl = "<?= baseUrl ?>";
    const currentPageBaseUrl = window.location.href.split('?')[0];
    const isAppsScriptEditorPanel = /script\.googleusercontent\.com/i.test(window.location.hostname)
      || /userCodeAppPanel/i.test(window.location.href);
    const baseUrl = isAppsScriptEditorPanel ? injectedBaseUrl : (currentPageBaseUrl || injectedBaseUrl);
    const token = "<?= token ?>";
    const authId = "<?= authId ?>";
    const autoOpen = "<?= autoOpen ?>";
    const returnAba = "<?= returnAba ?>";
    const returnId = "<?= returnId ?>";
    const returnBusca = "<?= returnBusca ?>";
    const returnAvopStatus = "<?= returnAvopStatus ?>";

    window.addEventListener('load', function () {
      const idEl = document.getElementById('id');
      if (idEl && authId) {
        idEl.value = authId;
        idEl.readOnly = true;
      }

      if (autoOpen === '1') {
        const card = document.querySelector('.card');
        if (card) {
          card.innerHTML = `
            <div class="title">Abrindo AVOP</div>
            <p class="muted">Registrando ci\u00eancia e preparando o documento para leitura.</p>
            <div class="msg" id="msg"></div>
          `;
        }
        enviar(true);
      }
    });

    function setMsg(text, ok = true) {
      const el = document.getElementById('msg');
      if (!el) return;
      el.textContent = text;
      el.style.color = ok ? 'green' : 'crimson';
    }

    function enviar(auto = false) {
      const nomeEl = document.getElementById('nome');
      const nome = nomeEl ? nomeEl.value.trim() : '';
      const btn = document.getElementById('btn');

      if (btn) btn.disabled = true;
      setMsg('Registrando ciência...', true);

      google.script.run
        .withSuccessHandler((res) => {
          if (!res || !res.ok) {
            setMsg((res && res.msg) ? res.msg : 'Não foi possível registrar a ciência.', false);
            if (btn) btn.disabled = false;
            return;
          }

          setMsg(res.msg, true);
          abrirPDF();
        })
        .withFailureHandler((err) => {
          setMsg('Falha: ' + (err && err.message ? err.message : err), false);
          if (btn) btn.disabled = false;
        })
        .registrarLeitura({ avopId, nome, token });
    }

    function buildReturnUrl() {
      const url = new URL(baseUrl, window.location.origin);
      url.searchParams.set('aba', returnAba || 'AVOP');
      url.searchParams.set('id', returnId || authId || '');
      url.searchParams.set('avopStatus', returnAvopStatus || 'TODOS');
      url.searchParams.set('autoSearch', '1');
      if (returnBusca) url.searchParams.set('busca', returnBusca);
      if (token) url.searchParams.set('token', token);
      return url.toString();
    }

    function abrirPDF() {
      document.body.innerHTML = '';

      const wrapper = document.createElement('div');
      wrapper.style.padding = '12px';
      wrapper.style.background = '#f5f7fa';
      wrapper.style.fontFamily = 'Arial, sans-serif';

      const barra = document.createElement('div');
      barra.style.marginBottom = '12px';

      const btn = document.createElement('button');
      btn.textContent = '← Voltar para a Central';
      btn.style.padding = '10px 14px';
      btn.style.border = '0';
      btn.style.borderRadius = '8px';
      btn.style.background = '#0d6efd';
      btn.style.color = 'white';
      btn.style.cursor = 'pointer';
      btn.style.fontWeight = '600';

      btn.addEventListener('click', function () {
        window.top.location.href = buildReturnUrl();
      });

      const viewer = document.createElement('iframe');
      viewer.src = pdfUrl;
      viewer.style.width = '100%';
      viewer.style.height = '90vh';
      viewer.style.border = 'none';

      barra.appendChild(btn);
      wrapper.appendChild(barra);
      wrapper.appendChild(viewer);
      document.body.appendChild(wrapper);
    }
  </script>
</body>
</html>
