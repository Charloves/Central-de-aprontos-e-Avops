name: Central Operacional V2 CI

on:
  pull_request:
    paths:
      - central-operacional-v2/**
      - .github/workflows/central-operacional-v2-ci.yml
  push:
    branches:
      - main
      - feature/central-operacional-v2
    paths:
      - central-operacional-v2/**
      - .github/workflows/central-operacional-v2-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: central-operacional-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Central Operacional V2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: central-operacional-v2/app
    env:
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: central-operacional-v2/app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --reporter=verbose

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Audit
        run: npm audit --offline=false --audit-level=moderate
